# SoloptiLinkAI — Windows 導入の実証 (機械実証)
#
# 【これは何か】
#   公開済みの Windows 配布物を、本物の Windows 上で実際に導入して通し、
#   お客様の端末で起きることを配信前に機械で確かめる。
#
# 【なぜ要るか — 2026-09-07 実測】
#   Windows について測っていたのは配布物の静的検分 (W1〜W7) だけで、
#   「実際に走らせる」軸が 1 本も無かった。実走に相当するのは実機の証跡のみで、
#   それが無い間は配信が止まる (G13b-WIN-LIVE = BLOCKED / 既定で有効)。
#   結果、実機を手配できない日は配信そのものが止まり、
#   止めない運用にすると Windows 固有の不具合はお客様の端末が初回実行の場になっていた
#   (この型が過去 8 回再発)。
#
# 【設計の要点 — ここを外すと偽合格になる】
#   ① インストーラは最後に無条件で exit 0 する (soloptilink-install.ps1:2051)。
#      よって終了コードを合否に使わない。判定は self-check.sh の JSON を読む。
#   ② self-check の自己申告だけに頼らず、置かれた物をファイルの実在で独立に数える。
#   ③ 端末認証 (-NoActivate で抑止) は測っていない。測っていないものを合格にしない。
#   ④ 日本語 Windows (システムの ANSI が cp932) は再起動が要るため再現できない。
#      本ワークフローの cp932 ジョブは「近似」であって実機と同等ではない。
#
# 【秘密情報】
#   1 件も要らない。配布物は公開リリースから匿名で取得し (HTTP 200 実測)、
#   端末認証は -NoActivate で行わない。署名鍵は管理者端末から出さない。
#
# 【置き場所】
#   公開リポジトリ onukih-design/soloptilink-releases の .github/workflows/
#   (公開リポジトリの Windows ランナーは無料。プライベートに置くと分単位課金 + Windows は倍率 2 倍)

name: Windows 導入の実証
run-name: "Windows 導入の実証 v${{ inputs.version }} (${{ inputs.source || 'public' }})"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "検証する版 (例: 2056.6)"
        required: true
        type: string
      expect_sha256:
        description: "Windows ZIP の SHA256 (指定すると照合する。省略時は照合しない=その旨を証跡に残す)"
        required: false
        type: string
      source:
        description: "配布物の取り先。public=公開済みリリース / draft=公開前の下書きリリース (お客様には見えない)"
        required: false
        default: public
        type: choice
        options:
          - public
          - draft

# ★2026-09-29: 公開前に Windows 実機で確かめられるよう、下書き (未公開) のリリースからも取れるようにした。
#   従来は「公開 → 実証 → 登録」の順でしか回らず、Windows で確かめないまま公開物がお客様の目に
#   触れる時間が必ずあった。下書きのリリースはお客様から見えず、自動更新の「最新版」にもならない。
#   下書きの一覧を読むにはこのリポジトリへの書き込み権のある鍵が要るため contents: write にしているが、
#   このワークフローの手順はリポジトリへ一切書き込まない (取得と検証だけ)。
permissions:
  contents: write

jobs:
  install-verify:
    name: 導入を通しで実証 (Windows Server / PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      # ── 0. 実行環境そのものを記録する ───────────────────────────────────
      #   何の上で測ったか分からない証跡は、後から根拠に使えない。
      - name: 実行環境を記録
        id: env
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $psv  = $PSVersionTable.PSVersion.ToString()
          $psed = $PSVersionTable.PSEdition
          $os   = [System.Environment]::OSVersion.VersionString
          $acp  = (Get-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Control\Nls\CodePage" -Name ACP).ACP
          $oemcp= (Get-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Control\Nls\CodePage" -Name OEMCP).OEMCP
          $loc  = (Get-Culture).Name
          Write-Host "PSVersion=$psv Edition=$psed"
          Write-Host "OS=$os"
          Write-Host "ACP=$acp OEMCP=$oemcp Culture=$loc"
          "psversion=$psv"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "psedition=$psed"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "osversion=$os"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "acp=$acp"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "culture=$loc"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          # PowerShell 5.1 (Desktop) でなければ、顧客と同じ実行系ではない = 実証にならない
          if ($psed -ne "Desktop") {
            Write-Host "::error::Not PowerShell Desktop (5.1). Not the same runtime as customers, so this is not a valid attestation."
            exit 1
          }

      # ── 1. 配布物を公開リリースから取得 (秘密情報ゼロ) ────────────────
      - name: 配布物を取得
        id: fetch
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ver = "${{ inputs.version }}".TrimStart("v")
          # 取り先の切り替え (public=匿名で取得 / draft=下書きリリースを鍵つきで取得)
          function Get-SlPackage([string]$ver, [string]$out) {
            $name = "SoloptiLinkAI_v${ver}_Windows.zip"
            if ("${{ inputs.source }}" -eq "draft") {
              $tok = "${{ github.token }}"
              $hdr = @{ Authorization = "Bearer $tok"; "X-GitHub-Api-Version" = "2022-11-28" }
              $rels = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" -Headers $hdr
              $rel = $rels | Where-Object { $_.draft -and $_.tag_name -eq "v$ver" } | Select-Object -First 1
              if (-not $rel) { Write-Host "::error::Draft release v$ver not found"; exit 1 }
              $asset = $rel.assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
              if (-not $asset) { Write-Host "::error::Asset $name not found in draft v$ver"; exit 1 }
              Write-Host "source: draft release v$ver asset $name"
              $hdr["Accept"] = "application/octet-stream"
              Invoke-WebRequest -Uri $asset.url -Headers $hdr -OutFile $out -UseBasicParsing
            } else {
              $url = "https://github.com/${{ github.repository }}/releases/download/v$ver/$name"
              Write-Host "source: $url"
              # 認証情報を一切使わない (お客様と同じ条件で取得できることを同時に確かめる)
              Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
            }
          }
          $out = "$env:RUNNER_TEMP\win.zip"
          Get-SlPackage $ver $out
          $size = (Get-Item $out).Length
          $sha  = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
          Write-Host "bytes=$size sha256=$sha"
          if ($size -lt 1048576) {
            Write-Host "::error::Downloaded package is under 1MB (bytes=$size). Empty or corrupted."
            exit 1
          }
          "zip=$out"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "bytes=$size"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$sha"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: SHA256 を照合
        id: sha
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $expect = "${{ inputs.expect_sha256 }}".Trim().ToLower()
          $actual = "${{ steps.fetch.outputs.sha256 }}"
          if ([string]::IsNullOrWhiteSpace($expect)) {
            # 照合しなかったことを黙って通さない。証跡に残して未照合と分かるようにする。
            Write-Host "::warning::No expected SHA256 given, so it was NOT verified (recorded as unverified)."
            "verified=not_requested" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } elseif ($expect -eq $actual) {
            Write-Host "SHA256 matches"
            "verified=match" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host "::error::SHA256 mismatch expect=$expect actual=$actual - verifying a different artifact is meaningless. Aborting."
            exit 1
          }

      - name: 展開
        id: extract
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dst = "$env:RUNNER_TEMP\pkg"
          Expand-Archive -Path "${{ steps.fetch.outputs.zip }}" -DestinationPath $dst -Force
          # ZIP 直下に 1 段フォルダが入る作りなので、installer を持つ階層を探す
          $root = $dst
          $cand = Get-ChildItem -Path $dst -Directory | Where-Object {
                    Test-Path (Join-Path $_.FullName "installer\soloptilink-install.ps1") }
          if ($cand) { $root = $cand[0].FullName }
          $ps1 = Join-Path $root "installer\soloptilink-install.ps1"
          if (-not (Test-Path $ps1)) {
            Write-Host "::error::Installer not found: $ps1"
            Get-ChildItem -Path $dst -Recurse -Depth 2 | Select-Object -First 40 FullName | Format-Table -AutoSize
            exit 1
          }
          # 空ファイル耐性: 在ることと中身があることは別
          if ((Get-Item $ps1).Length -lt 1024) {
            Write-Host "::error::Installer is under 1KB (empty or corrupted)."
            exit 1
          }
          Write-Host "root=$root"
          "root=$root" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ps1=$ps1"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # ── 2. 構文が 5.1 で通るか (段階 1) ────────────────────────────────
      #   実走の前に構文だけを見る。ここで落ちれば実走は必ず落ちるので、原因が絞れる。
      - name: 構文を確認 (PowerShell 5.1)
        id: syntax
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $errs = $null
          $null = [System.Management.Automation.PSParser]::Tokenize(
                    (Get-Content -Raw "${{ steps.extract.outputs.ps1 }}"), [ref]$errs)
          $n = if ($errs) { $errs.Count } else { 0 }
          Write-Host "syntax errors: $n"
          if ($n -gt 0) {
            $errs | Select-Object -First 10 | ForEach-Object {
              Write-Host ("  line {0}: {1}" -f $_.Token.StartLine, $_.Message) }
            Write-Host "::error::$n syntax error(s) under PowerShell 5.1 - customers would crash right at startup."
            exit 1
          }
          "errors=0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # ── 3. 導入を実走 (段階 2) ─────────────────────────────────────────
      #   ★終了コードは判定に使わない (インストーラは無条件 exit 0)。
      #     ここでは「最後まで到達したか」を、インストーラ自身が残す記録から読む。
      - name: 導入を実走 (PowerShell 5.1 / 端末認証なし)
        id: install
        shell: powershell
        env:
          SOLOPTILINK_NO_END_PAUSE: "1"
        run: |
          $ErrorActionPreference = "Continue"
          $t0 = Get-Date
          & "${{ steps.extract.outputs.ps1 }}" -NoActivate 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\install.log"
          $rc = $LASTEXITCODE
          $sec = [int]((Get-Date) - $t0).TotalSeconds
          Write-Host "----- installer exit code: $rc (NOT used for the verdict) / elapsed ${sec}s -----"
          "rc=$rc"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "seconds=$sec" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 止まった工程を判定
        id: halt
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          # インストーラは失敗時に setup_detail.txt へ installer-failure step=N/11 を残す
          $detail = Get-ChildItem -Path "$env:USERPROFILE" -Filter "setup_detail.txt" -Recurse -ErrorAction SilentlyContinue |
                    Select-Object -First 1
          $halted = ""
          if ($detail) {
            $line = Select-String -Path $detail.FullName -Pattern "installer-failure" -SimpleMatch |
                    Select-Object -First 1
            if ($line) { $halted = $line.Line.Trim() }
          }
          if ($halted) {
            Write-Host "::error::Install halted midway: $halted"
            "halted=$halted" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 1
          }
          Write-Host "no halt record found"
          "halted=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # ── 4. 置かれた物を独立に数える (段階 3) ──────────────────────────
      #   ★インストーラの自己申告ではなく、ファイルの実在で数える。
      #     「同梱されたか」ではなく「お客様の Claude が読む場所に置かれたか」を見る。
      - name: 置かれた物を数える
        id: placed
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $skills = Join-Path $env:USERPROFILE ".claude\skills"
          $ok = $true

          # (a) 呼び出し口が置かれたか
          $n = 0
          if (Test-Path $skills) {
            $n = (Get-ChildItem -Path $skills -Directory -ErrorAction SilentlyContinue).Count
          }
          Write-Host "skill dirs: $n"
          if ($n -lt 1) {
            Write-Host "::error::No skills were placed - typing the documented command would do nothing."
            $ok = $false
          }

          # (b) boost の本文が実在し、空でないか (在ることと中身があることは別)
          $boost = Join-Path $skills "soloptilink-boost\SKILL.md"
          $bsize = 0
          if (Test-Path $boost) { $bsize = (Get-Item $boost).Length }
          Write-Host "soloptilink-boost/SKILL.md: $bsize bytes"
          if ($bsize -lt 1024) {
            Write-Host "::error::soloptilink-boost body is missing or empty (bytes=$bsize)."
            $ok = $false
          }

          # (c) 管理者専用スキルが顧客側へ漏れていないか
          $leak = @()
          foreach ($adm in @("soloptilink-release","soloptilink-deploy","soloptilink-doctor")) {
            if (Test-Path (Join-Path $skills $adm)) { $leak += $adm }
          }
          if ($leak.Count -gt 0) {
            Write-Host ("::error::admin-only skills leaked to the customer side: " + ($leak -join ", "))
            $ok = $false
          } else {
            Write-Host "admin-only leak: none"
          }

          # (d2) 担当ロールが置かれたか (2026-09-08 追加)
          #   Windows の入口だけ、同梱されている担当ロールを置く処理が 1 行も無かった。
          #   Mac / Linux / Web は置いており、Windows のお客様だけ編成の規模が違う
          #   成果物になっていた。それでも導入は「完了」と表示されていた。
          $agentsDir = Join-Path $env:USERPROFILE ".claude\agents"
          $agents = 0
          if (Test-Path $agentsDir) {
            $agents = (Get-ChildItem -Path $agentsDir -Filter *.md -File -ErrorAction SilentlyContinue).Count
          }
          Write-Host "agent definitions placed: $agents"
          if ($agents -lt 1) {
            Write-Host "::error::No agent definitions were placed - Windows customers would get a smaller roster than Mac customers."
            $ok = $false
          }

          # (d) 自動更新フックが登録されたか (これが無いと以後の更新が永久に届かない)
          $settings = Join-Path $env:USERPROFILE ".claude\settings.json"
          $hook = 0
          if (Test-Path $settings) {
            $raw = Get-Content -Raw $settings
            if ($raw -match "hook-autoupdate" -or $raw -match "auto-update") { $hook = 1 }
          }
          Write-Host "auto-update hook registered: $hook"
          if ($hook -ne 1) {
            Write-Host "::error::Auto-update hook not registered - this customer would never receive updates."
            $ok = $false
          }

          "skills_dirs=$n"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "boost_bytes=$bsize" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "admin_leak=$($leak.Count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "agents=$agents"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "hook=$hook"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if (-not $ok) { exit 1 }

      # ── 5. 置いたものが動く (段階 4) ───────────────────────────────────
      - name: 本体が起動するか
        id: exe
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $exe = Join-Path $env:USERPROFILE ".soloptilink\soloptilink.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "::error::Launcher not placed: $exe"
            exit 1
          }
          $size = (Get-Item $exe).Length
          Write-Host "exe: $size bytes"
          $out = & $exe --version 2>&1 | Out-String
          $rc  = $LASTEXITCODE
          Write-Host "--version output: $out"
          Write-Host "--version exit code: $rc"
          if ([string]::IsNullOrWhiteSpace($out)) {
            Write-Host "::error::Launcher produced no output (placed but not working)."
            exit 1
          }
          "bytes=$size" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ran=1"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # ── 6. 出荷物自身の自己診断 (オラクル) ────────────────────────────
      #   ★ここが合否の主判定。インストーラの終了コードではなくこれを読む。
      #     Git Bash (C:\Program Files\Git\bin\bash.exe) は runner に既定で入っており、
      #     インストーラが探す既定パスと一致する。
      - name: 自己診断を実行
        id: selfcheck
        shell: bash
        run: |
          set -o pipefail
          SC="$USERPROFILE/.soloptilink/installer/self-check.sh"
          SC_WIN="${{ steps.extract.outputs.root }}/installer/self-check.sh"
          # 配置後の本体側を第一の出典にし、無ければ配布物側を使う
          if [ -f "$SC" ]; then TARGET="$SC"; SRC="installed";
          elif [ -f "$SC_WIN" ]; then TARGET="$SC_WIN"; SRC="package";
          else
            echo "::error::self-check not found (neither installed nor in package)."
            exit 1
          fi
          echo "self-check source: $SRC ($TARGET)"
          set +e
          bash "$TARGET" json > "$RUNNER_TEMP/selfcheck.json" 2> "$RUNNER_TEMP/selfcheck.err"
          RC=$?
          set -e
          echo "self-check exit code: $RC"
          if [ ! -s "$RUNNER_TEMP/selfcheck.json" ]; then
            echo "::error::self-check produced no verdict (not measured = not a pass)."
            cat "$RUNNER_TEMP/selfcheck.err" 2>/dev/null | head -20
            exit 1
          fi
          echo "sc_rc=$RC"   >> "$GITHUB_OUTPUT"
          echo "sc_src=$SRC" >> "$GITHUB_OUTPUT"
          echo "--- verdict ---"
          cat "$RUNNER_TEMP/selfcheck.json"

      - name: 自己診断の判定を読む
        id: verdict
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $raw = Get-Content -Raw "$env:RUNNER_TEMP\selfcheck.json"
          try { $d = $raw | ConvertFrom-Json } catch {
            Write-Host "::error::Could not read self-check verdict (not measured = not a pass)."
            exit 1
          }
          $items = $d.checks
          if (-not $items) {
            Write-Host "::error::self-check verdict is empty (not measured = not a pass)."
            exit 1
          }
          # Skipped on purpose in this environment. Not counted as a pass; reported as NOT MEASURED.
          #   device_activation : activation is intentionally skipped (-NoActivate)
          #   mcp_registration  : Claude Desktop is not installed on the runner
          #   devtools          : Claude Code is not installed on the runner
          #   NOTE: these are limits of THIS environment, not product defects.
          #         They are listed in "not_measured" of the attestation, so they
          #         are never silently treated as a pass.
          $skipIds = @("device_activation", "mcp_registration", "devtools")
          $ok = 0; $fail = 0; $unm = 0
          foreach ($it in $items) {
            $id = "$($it.id)"
            $v  = ("$($it.verdict)").ToUpper()
            if ($skipIds -contains $id) {
              $unm++
              Write-Host "NOT MEASURED - $id (intentionally skipped in this environment)"
              continue
            }
            if ($v -eq "PASS") { $ok++ }
            elseif ($v -eq "FAIL") {
              $fail++
              Write-Host "::error::self-check FAILED - $id : $($it.reason_ja)"
            } else {
              $unm++
              Write-Host "::warning::NOT MEASURED - $id ($v)"
            }
          }
          Write-Host "pass $ok / fail $fail / not-measured $unm"
          "pass_n=$ok"        | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "fail_n=$fail"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "unmeasured_n=$unm" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($fail -gt 0) { exit 1 }
      - name: 証跡を作成
        if: always()
        shell: powershell
        run: |
          $dir = "$env:RUNNER_TEMP\attest"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $rec = [ordered]@{
            kind    = "machine"
            version = "${{ inputs.version }}"
            result  = "${{ job.status }}"
            at      = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            runner  = [ordered]@{
              os            = "${{ steps.env.outputs.osversion }}"
              powershell    = "${{ steps.env.outputs.psversion }}"
              edition       = "${{ steps.env.outputs.psedition }}"
              ansi_codepage = "${{ steps.env.outputs.acp }}"
              culture       = "${{ steps.env.outputs.culture }}"
            }
            package = [ordered]@{
              bytes           = "${{ steps.fetch.outputs.bytes }}"
              sha256          = "${{ steps.fetch.outputs.sha256 }}"
              sha256_verified = "${{ steps.sha.outputs.verified }}"
            }
            stages = [ordered]@{
              syntax_errors               = "${{ steps.syntax.outputs.errors }}"
              install_seconds             = "${{ steps.install.outputs.seconds }}"
              installer_exit_code_ignored = "${{ steps.install.outputs.rc }}"
              halted_at                   = "${{ steps.halt.outputs.halted }}"
              skills_dirs                 = "${{ steps.placed.outputs.skills_dirs }}"
              boost_bytes                 = "${{ steps.placed.outputs.boost_bytes }}"
              admin_leak                  = "${{ steps.placed.outputs.admin_leak }}"
              agents_placed               = "${{ steps.placed.outputs.agents }}"
              autoupdate_hook             = "${{ steps.placed.outputs.hook }}"
              exe_ran                     = "${{ steps.exe.outputs.ran }}"
              selfcheck_pass              = "${{ steps.verdict.outputs.pass_n }}"
              selfcheck_fail              = "${{ steps.verdict.outputs.fail_n }}"
              selfcheck_unmeasured        = "${{ steps.verdict.outputs.unmeasured_n }}"
            }
            not_measured = @(
              "Real Japanese Windows (system ANSI = cp932): cannot be reproduced - changing the system locale requires a reboot",
              "Prerequisite install via winget: winget is not on the runner",
              "Smart App Control enabled machines: not available on Server",
              "Standard user / UAC enabled / domain-joined permissions: runner is admin with UAC off",
              "Claude Desktop actually loading the config: the app is not on the runner",
              "Device activation: intentionally skipped via -NoActivate",
              "Prerequisite developer tools (Claude Code): not installed on the runner",
              "Double-click launch: requires GUI interaction"
            )
          }
          $json = $rec | ConvertTo-Json -Depth 6
          [System.IO.File]::WriteAllText("$dir\windows-ci-attestation.json", $json, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "--- attestation ---"
          Write-Host $json
      - name: 証跡を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ci-attestation-${{ inputs.version }}
          path: ${{ runner.temp }}/attest/windows-ci-attestation.json
          retention-days: 90

      - name: 実行ログを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-log-${{ inputs.version }}
          path: |
            ${{ runner.temp }}/install.log
            ${{ runner.temp }}/selfcheck.json
            ${{ runner.temp }}/selfcheck.err
          retention-days: 30
          if-no-files-found: warn

  # ── 別ジョブ: cp932 近似 ─────────────────────────────────────────────────
  #   ★これは日本語 Windows の再現ではない。「近似」である。
  #     システムの ANSI コードページを cp932 にするには再起動が要り、
  #     自動実行環境では不可能。ここで測れるのは
  #     「出力の文字コードを cp932 に強制したときに処理が止まらないか」まで。
  codepage-932-approx:
    name: 文字コード cp932 の近似確認 (実機と同等ではない)
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true   # 近似のため、これ単独では配信を止めない

    steps:
      - name: 配布物を取得して展開
        id: prep
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ver = "${{ inputs.version }}".TrimStart("v")
          # 取り先の切り替え (public=匿名で取得 / draft=下書きリリースを鍵つきで取得)
          function Get-SlPackage([string]$ver, [string]$out) {
            $name = "SoloptiLinkAI_v${ver}_Windows.zip"
            if ("${{ inputs.source }}" -eq "draft") {
              $tok = "${{ github.token }}"
              $hdr = @{ Authorization = "Bearer $tok"; "X-GitHub-Api-Version" = "2022-11-28" }
              $rels = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" -Headers $hdr
              $rel = $rels | Where-Object { $_.draft -and $_.tag_name -eq "v$ver" } | Select-Object -First 1
              if (-not $rel) { Write-Host "::error::Draft release v$ver not found"; exit 1 }
              $asset = $rel.assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
              if (-not $asset) { Write-Host "::error::Asset $name not found in draft v$ver"; exit 1 }
              Write-Host "source: draft release v$ver asset $name"
              $hdr["Accept"] = "application/octet-stream"
              Invoke-WebRequest -Uri $asset.url -Headers $hdr -OutFile $out -UseBasicParsing
            } else {
              $url = "https://github.com/${{ github.repository }}/releases/download/v$ver/$name"
              Write-Host "source: $url"
              # 認証情報を一切使わない (お客様と同じ条件で取得できることを同時に確かめる)
              Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
            }
          }
          $out = "$env:RUNNER_TEMP\win.zip"
          Get-SlPackage $ver $out
          $dst = "$env:RUNNER_TEMP\pkg"
          Expand-Archive -Path $out -DestinationPath $dst -Force
          $root = $dst
          $cand = Get-ChildItem -Path $dst -Directory | Where-Object {
                    Test-Path (Join-Path $_.FullName "installer\soloptilink-install.ps1") }
          if ($cand) { $root = $cand[0].FullName }
          "root=$root" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: cp932 を強制して実走
        shell: powershell
        env:
          SOLOPTILINK_NO_END_PAUSE: "1"
          PYTHONIOENCODING: "cp932"
          SL_ROOT: ${{ steps.prep.outputs.root }}
        run: |
          $ErrorActionPreference = "Continue"
          # コンソールの入出力を cp932 に寄せる (システムの ANSI は変えられない)
          chcp 932 | Out-Null
          [Console]::OutputEncoding = [System.Text.Encoding]::GetEncoding(932)
          [Console]::InputEncoding  = [System.Text.Encoding]::GetEncoding(932)
          & (Join-Path $env:SL_ROOT "installer\soloptilink-install.ps1") -NoActivate 2>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP\install-932.log"
          Write-Host "----- exit code $LASTEXITCODE (NOT used for the verdict) -----"

      - name: 途中で止まっていないか
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $detail = Get-ChildItem -Path "$env:USERPROFILE" -Filter "setup_detail.txt" -Recurse -ErrorAction SilentlyContinue |
                    Select-Object -First 1
          if ($detail) {
            $line = Select-String -Path $detail.FullName -Pattern "installer-failure" -SimpleMatch | Select-Object -First 1
            if ($line) {
              Write-Host "::error::Install halted while output codepage was forced to cp932: $($line.Line.Trim())"
              exit 1
            }
          }
          # 置かれたかどうかも見る (化けても止まらず、かつ仕事をしたか)
          $skills = Join-Path $env:USERPROFILE ".claude\skills"
          $n = 0
          if (Test-Path $skills) { $n = (Get-ChildItem -Path $skills -Directory -ErrorAction SilentlyContinue).Count }
          Write-Host "skill dirs under cp932 approximation: $n"
          if ($n -lt 1) {
            Write-Host "::error::No skills placed when codepage is forced to cp932."
            exit 1
          }
          Write-Host "No halt under the cp932 approximation, and skills were placed. (NOT equivalent to a real Japanese Windows.)"

      - name: ログを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cp932-log-${{ inputs.version }}
          path: ${{ runner.temp }}/install-932.log
          retention-days: 30
          if-no-files-found: warn

  # ── お客様と同じ入口・同じ置き方での実証 (2026-09-29 追加) ─────────────────
  #   既存の実証は .ps1 を直接起動し、展開先も空白の無い場所だった。お客様は
  #   「まず最初にこれを実行.bat」をダブルクリックし、ダウンロード由来の印が付いた ZIP を、
  #   日本語や空白を含むフォルダ (C:\Users\山田 太郎\Downloads\SoloptiLinkAI (1)\ 等) へ展開する。
  #   この差が原因の不具合 (空白パスで自己診断が割れる件) が、実証を通っていながら残っていた。
  #   また同梱の全 .ps1 が、日本語 Windows の既定の読み方 (BOM 無しなら cp932) で壊れないかを見る。
  #   ★まずは報告のみ (continue-on-error)。一度緑になったことを確かめてから止める側へ切り替える。
  bat-entry-realistic:
    name: お客様と同じ入口で実証 (.bat・空白と日本語のパス・ダウンロード由来の印)
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: 配布物を取得して、お客様と同じ形で展開
        id: prep
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ver = "${{ inputs.version }}".TrimStart("v")
          # 取り先の切り替え (public=匿名で取得 / draft=下書きリリースを鍵つきで取得)
          function Get-SlPackage([string]$ver, [string]$out) {
            $name = "SoloptiLinkAI_v${ver}_Windows.zip"
            if ("${{ inputs.source }}" -eq "draft") {
              $tok = "${{ github.token }}"
              $hdr = @{ Authorization = "Bearer $tok"; "X-GitHub-Api-Version" = "2022-11-28" }
              $rels = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" -Headers $hdr
              $rel = $rels | Where-Object { $_.draft -and $_.tag_name -eq "v$ver" } | Select-Object -First 1
              if (-not $rel) { Write-Host "::error::Draft release v$ver not found"; exit 1 }
              $asset = $rel.assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
              if (-not $asset) { Write-Host "::error::Asset $name not found in draft v$ver"; exit 1 }
              Write-Host "source: draft release v$ver asset $name"
              $hdr["Accept"] = "application/octet-stream"
              Invoke-WebRequest -Uri $asset.url -Headers $hdr -OutFile $out -UseBasicParsing
            } else {
              $url = "https://github.com/${{ github.repository }}/releases/download/v$ver/$name"
              Write-Host "source: $url"
              # 認証情報を一切使わない (お客様と同じ条件で取得できることを同時に確かめる)
              Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
            }
          }
          # 展開先: 空白と日本語を含む (文字コードの影響を受けないよう文字番号で組み立てる)
          $jp = -join ([char[]](0x5C71, 0x7530, 0x0020, 0x592A, 0x90CE))
          $base = Join-Path $env:RUNNER_TEMP $jp
          $dst = Join-Path $base "SoloptiLinkAI (1)"
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          $zip = Join-Path $base "SoloptiLinkAI.zip"
          Get-SlPackage $ver $zip
          # ダウンロード由来の印 (Zone.Identifier / ZoneId=3) を ZIP に付ける
          Set-Content -Path $zip -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" -Encoding Ascii
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          # エクスプローラーの「すべて展開」と同じく、展開した全ファイルへ印を引き継ぐ
          Get-ChildItem -Path $dst -Recurse -File | ForEach-Object {
            Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" -Encoding Ascii -ErrorAction SilentlyContinue
          }
          $root = $dst
          $cand = Get-ChildItem -Path $dst -Directory | Where-Object {
                    Test-Path (Join-Path $_.FullName "installer\soloptilink-install.ps1") }
          if ($cand) { $root = $cand[0].FullName }
          # 最上位の起動口 (.bat) を名前ではなく場所で探す (日本語のファイル名をこの手順に書かない)
          $bat = Get-ChildItem -Path $root -Filter "*.bat" -File | Select-Object -First 1
          if (-not $bat) { Write-Host "::error::No .bat entry at the top of the package: $root"; exit 1 }
          Write-Host "root=$root"
          Write-Host "entry=$($bat.FullName)"
          "root=$root"            | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "bat=$($bat.FullName)"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 同梱の全 .ps1 が日本語 Windows の読み方で壊れないか
        shell: powershell
        # ★日本語を含む場所は本文へ埋め込まない。PowerShell 5.1 は BOM の無い一時スクリプトを
        #   ANSI で読むため、埋め込んだ「山田 太郎」が化けて構文エラーになる (2026-10-01 実測)。
        env:
          SL_ROOT: ${{ steps.prep.outputs.root }}
        run: |
          $ErrorActionPreference = "Continue"
          $root = $env:SL_ROOT
          $bad = 0; $n = 0
          $cp932 = [System.Text.Encoding]::GetEncoding(932)
          Get-ChildItem -Path $root -Recurse -Filter "*.ps1" -File | ForEach-Object {
            $n++
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            $hasBom = ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)
            if ($hasBom) { return }
            # BOM が無いファイルは、日本語 Windows の PowerShell 5.1 が cp932 として読む
            $text = $cp932.GetString($bytes)
            try { [void][ScriptBlock]::Create($text) } catch {
              $bad++
              Write-Host ("::error::Breaks when read as cp932 (no BOM): {0} : {1}" -f $_.TargetObject, $_.Exception.Message.Split("`n")[0])
              Write-Host ("  file: {0}" -f $_.FullName)
            }
          }
          Write-Host "ps1 files=$n broken-under-cp932=$bad"
          if ($bad -gt 0) { exit 1 }

      - name: .bat から導入を実走 (端末認証なし・入力なし)
        shell: powershell
        env:
          SOLOPTILINK_NO_END_PAUSE: "1"
          SOLOPTILINK_INSTALL_NO_ACTIVATE: "1"
          SL_BAT: ${{ steps.prep.outputs.bat }}
        run: |
          $ErrorActionPreference = "Continue"
          $bat = $env:SL_BAT
          $log = "$env:RUNNER_TEMP\install-bat.log"
          $t0 = Get-Date
          cmd /c "call `"$bat`" < nul" 2>&1 | Tee-Object -FilePath $log
          $sec = [int]((Get-Date) - $t0).TotalSeconds
          Write-Host "----- exit code $LASTEXITCODE (NOT used for the verdict) / elapsed ${sec}s -----"

      - name: 途中で止まらず、自己診断まで届いたか
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $detail = Get-ChildItem -Path "$env:USERPROFILE" -Filter "setup_detail.txt" -Recurse -ErrorAction SilentlyContinue |
                    Select-Object -First 1
          if ($detail) {
            $line = Select-String -Path $detail.FullName -Pattern "installer-failure" -SimpleMatch | Select-Object -First 1
            if ($line) { Write-Host "::error::Install halted via the .bat entry: $($line.Line.Trim())"; exit 1 }
          }
          $skills = Join-Path $env:USERPROFILE ".claude\skills"
          $n = 0
          if (Test-Path $skills) { $n = (Get-ChildItem -Path $skills -Directory -ErrorAction SilentlyContinue).Count }
          Write-Host "skill dirs placed via .bat entry: $n"
          if ($n -lt 1) { Write-Host "::error::No skills placed via the .bat entry."; exit 1 }
          # 空白を含む展開先でも自己診断が起動できたか (以前は引数が割れて exit 127 で起動できなかった)
          $log = Get-Content "$env:RUNNER_TEMP\install-bat.log" -Raw -ErrorAction SilentlyContinue
          if ($log -and ($log -match "self-check.*No such file|exit code 127")) {
            Write-Host "::error::Self-check could not start under a path with spaces."; exit 1
          }
          Write-Host "Reached the end via the customer's entry (.bat) under a path with spaces and Japanese characters."

      # ★2026-09-29: 新しい版の全スキルは起動直後に「ご利用確認」(Step 0) を行う。Windows では本体の名前が
      #   soloptilink.exe のため、判定が通らないと契約中の Windows のお客様全員で当社の機能が使えなくなる
      #   (Mac では砂箱で確認済み・Windows は未検証だった)。承認済みの端末と同じ記録を置き、通信先を
      #   届かない宛先 (127.0.0.1:9) へ向けて、手元の記録での判定が AUTHORIZED になることを確かめる。
      #   あわせて、期限切れの記録では AUTHORIZED にならないこと (判定が素通りしていないこと) も見る。
      #   置く記録の欄は、本体が承認時に保存するもの (launcher/license.go の saveActivation / saveToken) と同じ。
      - name: ご利用確認 (Step 0) が Windows で正しく判定されるか
        shell: powershell
        env:
          SOLOPTILINK_API_URL: "https://127.0.0.1:9/api/v1"
        run: |
          $ErrorActionPreference = "Continue"
          $sl = Join-Path $env:USERPROFILE ".soloptilink"
          $bash = $null
          foreach ($c in @("$env:ProgramFiles\Git\bin\bash.exe", "${env:ProgramFiles(x86)}\Git\bin\bash.exe")) { if (Test-Path $c) { $bash = $c; break } }
          if (-not $bash) { Write-Host "::error::Git Bash not found (Step 0 runs in Git Bash on customer PCs)"; exit 1 }
          if (-not (Test-Path (Join-Path $sl "lib\evict\failopen.sh"))) { Write-Host "::error::failopen.sh was not installed"; exit 1 }
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          function Write-Records([int]$days) {
            $exp = (Get-Date).ToUniversalTime().AddDays($days).ToString("yyyy-MM-ddTHH:mm:ssZ")
            $act = '{"email":"ci@example.test","company_code":"CI0001","device_id":"dev_ci0001","fingerprint":"fp-v2-ci","hardware_uuid":"00000000-0000-0000-0000-000000000000","activated_at":"2026-09-01T00:00:00Z","server_key_half":"Y2k="}'
            $lic = '{"token":"tok_ci","device_id":"dev_ci0001","company_id":"","company_code":"CI0001","status":"approved","issued_at":"2026-09-01T00:00:00Z","expires_at":"' + $exp + '","signature":""}'
            [System.IO.File]::WriteAllText((Join-Path $sl "activation.json"), $act, $utf8)
            [System.IO.File]::WriteAllText((Join-Path $sl "license.json"), $lic, $utf8)
            Remove-Item (Join-Path $sl ".license\.status_cache.json") -Force -ErrorAction SilentlyContinue
            Remove-Item (Join-Path $sl ".license-revoked") -Force -ErrorAction SilentlyContinue
          }
          # 1) 承認済み・期限 30 日先 → AUTHORIZED であること
          Write-Records 30
          $ok = (& $bash -lc 'bash ~/.soloptilink/lib/evict/failopen.sh verdict 2>/dev/null || echo FAILOPEN' 2>&1 | Select-Object -Last 1)
          Write-Host "approved (30 days ahead): $ok"
          # 2) 承認済み・期限切れ → AUTHORIZED にならないこと (判定が素通りしていない)
          Write-Records -2
          $ng = (& $bash -lc 'bash ~/.soloptilink/lib/evict/failopen.sh verdict 2>/dev/null || echo FAILOPEN' 2>&1 | Select-Object -Last 1)
          Write-Host "approved but expired: $ng"
          # 片付け (この仮想機は使い捨てだが、次の手順に影響させない)
          Remove-Item (Join-Path $sl "activation.json"), (Join-Path $sl "license.json") -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $sl ".license\.status_cache.json") -Force -ErrorAction SilentlyContinue
          if ("$ok".Trim() -ne "AUTHORIZED") { Write-Host "::error::Step 0 did not authorize an approved Windows device (got '$ok'). Every Windows customer would lose the product features."; exit 1 }
          if ("$ng".Trim() -eq "AUTHORIZED") { Write-Host "::error::Step 0 authorized an expired record (got '$ng'). The check is being bypassed."; exit 1 }
          Write-Host "Step 0 on Windows: approved=AUTHORIZED / expired=not AUTHORIZED (both sides)."

      - name: ログを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-bat-entry-log-${{ inputs.version }}
          path: ${{ runner.temp }}/install-bat.log
          retention-days: 30
          if-no-files-found: warn
